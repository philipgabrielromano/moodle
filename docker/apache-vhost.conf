<VirtualHost *:${PORT}>
    DocumentRoot __DOCROOT__

    <Directory __DOCROOT__>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        __FALLBACK__
    </Directory>

    # Moodle needs PATH_INFO for slash arguments (SCORM, file serving)
    AcceptPathInfo On

    # Never serve sensitive files
    <FilesMatch "^(config\.php|\.git.*|composer\.(json|lock))$">
        Require all denied
    </FilesMatch>

    # Trust Render's proxy for the client scheme
    SetEnvIf X-Forwarded-Proto https HTTPS=on

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
